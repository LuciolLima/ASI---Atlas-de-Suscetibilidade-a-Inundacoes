storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces

  # For production, use S3/GCS:
  # trace:
  #   backend: s3
  #   s3:
  #     bucket: tempo-traces
  #     endpoint: s3.amazonaws.com
  #     region: us-east-1

compactor:
  compaction:
    block_retention: 7d
    compacted_block_retention: 1h

ingester:
  max_block_duration: 1h
  max_block_bytes: 1048576  # 1MB

querier:
  max_block_duration: 1h

compactor:
  compaction:
    block_retention: 7d

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces

server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    zipkin:
      endpoint: 0.0.0.0:9411

# For production, add:
# limits:
#   ingestion_rate: 10000
#   ingestion_burst_size: 20000
#   per_stream_rate_limit: 10000
#   per_stream_rate_limit_burst: 20000