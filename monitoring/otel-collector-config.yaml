receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      scrape_configs:
        - job_name: 'asi-app'
          static_configs:
            - targets: ['asi-app:8501']
          metrics_path: '/metrics'
        - job_name: 'asi-health'
          static_configs:
            - targets: ['asi-app:8501']
          metrics_path: '/_health'
        - job_name: 'otel-collector'
          static_configs:
            - targets: ['localhost:8888']

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
  prometheusremotewrite:
    endpoint: "http://prometheus:9090/api/v1/write"
  logging:
    loglevel: debug

  # Optional: Loki for logs
  loki:
    endpoint: "http://loki:3100/loki/api/v1/push"

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  resource:
    attributes:
      - key: service.name
        value: "asi"
        action: upsert
      - key: service.version
        value: "3.2.0"
        action: upsert
      - key: deployment.environment
        value: "production"
        action: upsert
  attributes:
    actions:
      - key: http.request.header.*
        action: delete
      - key: http.response.header.*
        action: delete

extensions:
  health_check:
  pprof:
    endpoint: 0.0.0.0:1777
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource, attributes]
      exporters: [logging, prometheusremotewrite]
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch, resource]
      exporters: [prometheus, prometheusremotewrite, logging]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [logging, loki]