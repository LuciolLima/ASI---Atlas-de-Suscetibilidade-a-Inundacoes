<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" width="400" height="400">
  <defs>
    <!-- Fundo gradiente escuro -->
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d1f35"/>
      <stop offset="100%" stop-color="#060e1a"/>
    </radialGradient>
    <!-- Gradiente azul água para círculo externo -->
    <linearGradient id="ring_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#0050a0"/>
    </linearGradient>
    <!-- Gradiente TWI heatmap: azul→amarelo→vermelho -->
    <linearGradient id="heatmap" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%"   stop-color="#1E90FF"/>
      <stop offset="35%"  stop-color="#00d4aa"/>
      <stop offset="65%"  stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#8B0000"/>
    </linearGradient>
    <!-- Glow azul -->
    <filter id="glow_blue" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Glow vermelho crítico -->
    <filter id="glow_red" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Sombra texto -->
    <filter id="txt_shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <!-- Clip círculo -->
    <clipPath id="circle_clip">
      <circle cx="200" cy="190" r="128"/>
    </clipPath>
    <!-- Gradiente brilho superior -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ── FUNDO ── -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- ── ANEL EXTERNO decorativo pontilhado (grade cartográfica) ── -->
  <circle cx="200" cy="190" r="155" fill="none" stroke="#0a3a6e" stroke-width="1"
          stroke-dasharray="4 6" opacity="0.5"/>
  <circle cx="200" cy="190" r="165" fill="none" stroke="#0a3a6e" stroke-width="0.5"
          stroke-dasharray="2 10" opacity="0.3"/>

  <!-- ── ANEL PRINCIPAL ── -->
  <circle cx="200" cy="190" r="142" fill="none" stroke="url(#ring_grad)"
          stroke-width="4" opacity="0.9" filter="url(#glow_blue)"/>

  <!-- ── CÍRCULO BASE (fundo do mapa) ── -->
  <circle cx="200" cy="190" r="128" fill="#0a1e35"/>

  <!-- ── CAMADAS DE TERRENO — curvas de nível estilizadas ── -->
  <!-- Camada mais baixa (azul — área de acúmulo hídrico) -->
  <ellipse cx="200" cy="210" rx="105" ry="60" fill="#0d2d50" clip-path="url(#circle_clip)"/>
  <!-- Camada intermediária -->
  <ellipse cx="200" cy="205" rx="82" ry="44" fill="#0f3a62" clip-path="url(#circle_clip)"/>
  <!-- Camada alta -->
  <ellipse cx="195" cy="195" rx="58" ry="30" fill="#112e4c" clip-path="url(#circle_clip)"/>
  <!-- Pico elevado esquerdo -->
  <ellipse cx="168" cy="185" rx="34" ry="22" fill="#143554" clip-path="url(#circle_clip)"/>
  <!-- Pico elevado direito -->
  <ellipse cx="232" cy="188" rx="28" ry="18" fill="#143554" clip-path="url(#circle_clip)"/>

  <!-- ── CURVAS DE NÍVEL (contour lines) ── -->
  <g clip-path="url(#circle_clip)" opacity="0.35" fill="none" stroke="#1a6090" stroke-width="0.8">
    <ellipse cx="200" cy="215" rx="108" ry="63"/>
    <ellipse cx="200" cy="208" rx="90" ry="52"/>
    <ellipse cx="200" cy="200" rx="72" ry="40"/>
    <ellipse cx="198" cy="192" rx="55" ry="28"/>
    <ellipse cx="196" cy="184" rx="38" ry="18"/>
  </g>

  <!-- ── REDE HIDROGRÁFICA (linhas de rio) ── -->
  <g clip-path="url(#circle_clip)" fill="none" stroke="#00BFFF" stroke-width="1.5"
     opacity="0.6" filter="url(#glow_blue)">
    <!-- Rio principal -->
    <path d="M 110 260 Q 140 240 165 220 Q 185 205 200 195 Q 215 185 235 175 Q 255 165 280 160"/>
    <!-- Afluente 1 -->
    <path d="M 155 270 Q 165 250 175 235 Q 185 220 190 208" stroke-width="1"/>
    <!-- Afluente 2 -->
    <path d="M 245 255 Q 235 240 225 225 Q 215 210 208 200" stroke-width="1"/>
    <!-- Afluente pequeno -->
    <path d="M 200 195 Q 192 178 185 165 Q 178 153 172 142" stroke-width="0.8"/>
  </g>

  <!-- ── PONTOS TWI — heatmap de suscetibilidade ── -->
  <!-- Zona CRÍTICA (vermelho escuro) — fundo de vale -->
  <circle cx="200" cy="225" r="9"  fill="#8B0000" opacity="0.9" filter="url(#glow_red)"/>
  <circle cx="185" cy="232" r="7"  fill="#8B0000" opacity="0.75" filter="url(#glow_red)"/>
  <circle cx="215" cy="228" r="6"  fill="#8B0000" opacity="0.7"  filter="url(#glow_red)"/>
  <circle cx="172" cy="238" r="5"  fill="#8B0000" opacity="0.6"/>
  <circle cx="228" cy="235" r="5"  fill="#8B0000" opacity="0.6"/>

  <!-- Zona ALTA (laranja) -->
  <circle cx="165" cy="220" r="5"  fill="#FF4500" opacity="0.75"/>
  <circle cx="238" cy="218" r="5"  fill="#FF4500" opacity="0.75"/>
  <circle cx="195" cy="215" r="4"  fill="#FF4500" opacity="0.6"/>
  <circle cx="210" cy="212" r="4"  fill="#FF4500" opacity="0.6"/>
  <circle cx="150" cy="230" r="4"  fill="#FF4500" opacity="0.55"/>
  <circle cx="252" cy="226" r="4"  fill="#FF4500" opacity="0.55"/>

  <!-- Zona MODERADA (amarelo) -->
  <circle cx="155" cy="205" r="4"  fill="#FFD700" opacity="0.6"/>
  <circle cx="248" cy="208" r="4"  fill="#FFD700" opacity="0.6"/>
  <circle cx="175" cy="195" r="3"  fill="#FFD700" opacity="0.55"/>
  <circle cx="228" cy="198" r="3"  fill="#FFD700" opacity="0.55"/>
  <circle cx="140" cy="218" r="3"  fill="#FFD700" opacity="0.5"/>
  <circle cx="262" cy="215" r="3"  fill="#FFD700" opacity="0.5"/>

  <!-- Zona BAIXA (azul claro) -->
  <circle cx="170" cy="180" r="3"  fill="#1E90FF" opacity="0.55"/>
  <circle cx="232" cy="182" r="3"  fill="#1E90FF" opacity="0.55"/>
  <circle cx="155" cy="188" r="2.5" fill="#1E90FF" opacity="0.5"/>
  <circle cx="248" cy="190" r="2.5" fill="#1E90FF" opacity="0.5"/>
  <circle cx="185" cy="170" r="2.5" fill="#ADD8E6" opacity="0.45"/>
  <circle cx="218" cy="172" r="2.5" fill="#ADD8E6" opacity="0.45"/>
  <circle cx="200" cy="165" r="2"   fill="#ADD8E6" opacity="0.4"/>

  <!-- ── PIN de localização (marcador central) ── -->
  <g filter="url(#glow_red)">
    <path d="M 200 243 L 194 228 A 8 8 0 1 1 206 228 Z" fill="#FF2200" opacity="0.95"/>
    <circle cx="200" cy="221" r="5" fill="#ffffff" opacity="0.9"/>
    <circle cx="200" cy="221" r="2.5" fill="#FF2200"/>
  </g>

  <!-- ── BRILHO SUPERIOR (reflexo vítreo) ── -->
  <ellipse cx="185" cy="110" rx="70" ry="30"
           fill="url(#shine)" clip-path="url(#circle_clip)"/>

  <!-- ── BARRA LEGENDA lateral direita (dentro do círculo) ── -->
  <g clip-path="url(#circle_clip)" opacity="0.85">
    <rect x="295" y="155" width="8" height="80" rx="3"
          fill="url(#heatmap)" stroke="#ffffff22" stroke-width="0.5"/>
    <text x="307" y="160" fill="#8B0000" font-family="Arial" font-size="6" font-weight="bold">C</text>
    <text x="307" y="197" fill="#FFD700" font-family="Arial" font-size="6" font-weight="bold">M</text>
    <text x="307" y="238" fill="#1E90FF" font-family="Arial" font-size="6" font-weight="bold">B</text>
  </g>

  <!-- ── SIGLA "ASI" ── -->
  <text x="200" y="308" font-family="Arial Black, Arial" font-size="52" font-weight="900"
        fill="#ffffff" text-anchor="middle" letter-spacing="8"
        filter="url(#txt_shadow)">ASI</text>

  <!-- ── NOME COMPLETO ── -->
  <text x="200" y="330" font-family="Arial" font-size="9.5" font-weight="bold"
        fill="#00BFFF" text-anchor="middle" letter-spacing="1.5"
        filter="url(#txt_shadow)">ATLAS DE SUSCETIBILIDADE A INUNDAÇÕES</text>

  <!-- ── SUBTÍTULO ── -->
  <text x="200" y="347" font-family="Arial" font-size="7.5"
        fill="#6ab4d8" text-anchor="middle" letter-spacing="0.8">
    SIGWeb · Pernambuco · Brasil
  </text>

  <!-- ── LINHA DECORATIVA inferior ── -->
  <line x1="100" y1="356" x2="300" y2="356" stroke="#00BFFF" stroke-width="0.6" opacity="0.4"/>

  <!-- ── VERSÃO ── -->
  <text x="200" y="369" font-family="Arial" font-size="6.5"
        fill="#3a6a90" text-anchor="middle" letter-spacing="1">
    v3.0 · Open Source · Apache 2.0
  </text>
</svg>
