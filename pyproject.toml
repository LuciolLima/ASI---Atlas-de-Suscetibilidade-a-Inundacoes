[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asi-atlas"
version = "3.1.0"
description = "Atlas de Suscetibilidade a Inundacoes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.35.0",
    "streamlit-folium>=0.20.0",
    "folium>=0.16.0",
    "pyproj>=3.6.0",
    "geopy>=2.4.0",
    "pandas>=2.2.0",
    "plotly>=5.22.0",
    "requests>=2.31.0",
    "sidrapy>=0.1.4",
    "gdown>=4.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.5.0",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "types-requests>=2.31",
    "pandera>=0.19",
    "icontract>=2.7",
]
validation = [
    "pandera>=0.19",
]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "W", "I", "N", "D", "UP", "YTT", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "NPY", "T20", "TCH", "INP", "PIE", "PT", "RET", "SLF", "SIM", "TID"]
ignore = ["E501", "D100", "D101", "D102", "D103", "D104", "D107"]
per-file-ignores = { "tests/*" = ["S101", "D100", "D101", "D102", "D103", "D104", "D107"], "src/sigweb/components.py" = ["E501"], "src/analysis/analytics.py" = ["E501"] }
exclude = [".git", ".venv", "venv", "build", "dist", "*.excalidraw", "data", "__pycache__"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
enable_error_code = ["unused-ignore", "redundant-cast"]
exclude = [".venv", "build", "dist", "\\.excalidraw$", "data", "tests/fixtures"]

[[tool.mypy.overrides]]
module = ["streamlit.*", "folium.*", "streamlit_folium.*", "plotly.*", "plotly.express", "plotly.graph_objects", "sidrapy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [ "unit: Unit tests", "integration: Integration tests", "slow: Slow tests" ]
filterwarnings = [ "ignore::DeprecationWarning:streamlit", "ignore::UserWarning:pandas" ]

[tool.coverage.run]
source = ["src"]
omit = [ "tests/*", "*/__pycache__/*", "*/conftest.py" ]
branch = true

[tool.coverage.report]
exclude_lines = [ "pragma: no cover", "def __repr__", "raise AssertionError", "raise NotImplementedError", "if __name__ == .__main__.:", ]

[tool.icontract]